# ============================================================
# KeepSafe Backend — Docker Compose (Production)
# ============================================================
# TimescaleDB (PostgreSQL 15) + Redis 7 + EMQX 5 + Backend API
#
# Prerequisites:
#   1. Copy .env.production to .env and fill in all values
#   2. Place credentials/ under project root (FCM JSON, APNs key)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f app
#   docker compose ps
# ============================================================

services:
  # ──────────────────────────────────────────────
  # TimescaleDB (PostgreSQL 15 with time-series)
  # ──────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: keepsafe-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keepsafe}
      POSTGRES_USER: ${POSTGRES_USER:-keepsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dbschema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keepsafe} -d ${POSTGRES_DB:-keepsafe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - keepsafe-net

  # ──────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: keepsafe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - keepsafe-net

  # ──────────────────────────────────────────────
  # EMQX 5 (MQTT Broker)
  # ──────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.7.1
    container_name: keepsafe-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT TCP
      - "18083:18083" # Dashboard Web UI
    environment:
      # ── Dashboard ──
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}

      # ── Device Auth via Backend HTTP API ──
      EMQX_AUTHENTICATION__1__ENABLE: "true"
      EMQX_AUTHENTICATION__1__BACKEND: http
      EMQX_AUTHENTICATION__1__METHOD: post
      EMQX_AUTHENTICATION__1__URL: "http://app:8000/api/v1/auth/device"
      EMQX_AUTHENTICATION__1__HEADERS__CONTENT_TYPE: application/json
      EMQX_AUTHENTICATION__1__BODY__TEMPLATE: '{"device_id":"${username}","token":"${password}"}'
      EMQX_AUTHENTICATION__1__HTTP_REQUEST_MODE: sync
      EMQX_AUTHENTICATION__1__HTTP_SUCCESS_STATUS_CODES: "[200]"
      EMQX_AUTHENTICATION__1__RESPONSE_RESULT__ALLOW: '"allow"'

      # ── Device Authorization ACL via Backend HTTP API ──
      EMQX_AUTHORIZATION__1__ENABLE: "true"
      EMQX_AUTHORIZATION__1__BACKEND: http
      EMQX_AUTHORIZATION__1__METHOD: get
      EMQX_AUTHORIZATION__1__URL: >-
        http://app:8000/api/v1/auth/device/acl?device_id=${username}&topic=${topic}&action=${action}
      EMQX_AUTHORIZATION__1__HEADERS__CONTENT_TYPE: application/json
      EMQX_AUTHORIZATION__1__HTTP_REQUEST_MODE: sync
      EMQX_AUTHORIZATION__1__HTTP_SUCCESS_STATUS_CODES: "[200]"
      EMQX_AUTHORIZATION__1__RESPONSE_RESULT__ALLOW: '"allow"'

      # ── MQTT Protocol Settings ──
      EMQX_MQTT__MAX_TOPIC_LEVELS: 8
      EMQX_MQTT__MAX_PACKET_SIZE: 2MB
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: 100000
      EMQX_MQTT__SESSION_EXPIRY_INTERVAL: 2h

      # ── Logging ──
      EMQX_LOG__CONSOLE__LEVEL: info
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      app:
        condition: service_started
    networks:
      - keepsafe-net

  # ──────────────────────────────────────────────
  # Backend API (FastAPI)
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: keepsafe-backend:${APP_VERSION:-latest}
    container_name: keepsafe-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override host values for Docker networking
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMQX_HOST: emqx
      EMQX_PORT: "1883"
    volumes:
      # Mount credentials for FCM/APNs (not baked into image)
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - keepsafe-net

# ── Networks ──────────────────────────────────────
networks:
  keepsafe-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  emqx-data:
  emqx-log:
