# ── Mini-Program → Backend API Alignment ───────────
api_alignment:
  status: PASS
  total_endpoints_miniapp: 25
  aligned: 24
  stubbed: 1  # getShareLink — 后端暂未实现
  base_url: "http://43.163.5.90:8000/api/v1"
  
  # All aligned endpoints:
  aligned_endpoints:
    - login:              POST /users/login
    - register:           POST /users/register
    - getUserInfo:        GET  /users/profile
    - updateUserInfo:     PUT  /users/profile
    - registerPushToken:  POST /users/me/push-token
    - getDeviceList:      GET  /users/me/devices
    - getDeviceLocation:          GET  /devices/{id}/location
    - getDeviceStatus:            GET  /devices/{id}/status
    - getDeviceLocationHistory:   GET  /devices/{id}/history
    - getSosEvents:               GET  /devices/{id}/sos/events
    - bindDevice:         POST /devices/bind
    - unbindDevice:       DELETE /devices/{id}/bind
    - getFenceList:       GET  /devices/{id}/fences
    - getFenceById:       GET  /devices/{id}/fences/{fid}
    - createFence:        POST /devices/{id}/fences
    - updateFence:        PUT  /devices/{id}/fences/{fid}
    - deleteFence:        DELETE /devices/{id}/fences/{fid}
    - getAlertList:       GET  /alerts/
    - markAlertRead:      PUT  /alerts/{id}/read
    - markAllAlertsRead:  PUT  /alerts/read-all
    - shareDevice:        POST /devices/{id}/share
    - getShareList:       GET  /devices/{id}/shares
    - revokeShare:        DELETE /devices/{id}/share/{sid}
    - getSharedWithMe:    GET  /devices/shared-with-me

